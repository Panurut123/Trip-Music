<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip Music Diagnostics</title>
<style>
:root{--bg:#090c11;--panel:#171c24;--panel2:#202630;--text:#f4f7f2;--muted:#aab5a7;--green:#53e076;--red:#ff8f88;--yellow:#ffd17a;--border:rgba(199,222,201,.14)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(700px 380px at 12% -5%,rgba(83,224,118,.11),transparent 70%),var(--bg);color:var(--text);font:15px system-ui,"Noto Sans Thai",sans-serif;padding:clamp(18px,4vw,42px)}main{max-width:900px;margin:auto}h1{font-size:clamp(24px,4vw,38px);color:var(--green);margin:0 0 26px;font-weight:900;letter-spacing:-.045em}h1:after{content:"LOCAL SYSTEM CHECK";display:block;margin-top:7px;color:var(--muted);font-size:9px;letter-spacing:.18em}.card{background:linear-gradient(145deg,rgba(29,35,44,.82),rgba(17,21,27,.76));border:1px solid var(--border);box-shadow:0 24px 70px rgba(0,0,0,.18);backdrop-filter:blur(18px);border-radius:24px;padding:22px;margin-bottom:15px}.card h3{margin:0 0 15px!important;color:var(--muted)!important;font-size:9px!important;letter-spacing:.16em!important}.checklist{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{display:flex;justify-content:space-between;align-items:center;min-height:54px;padding:11px 14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.025);border-radius:15px}.label{font-weight:700;color:var(--muted);font-size:11px}.val{font-weight:850;font-size:11px}.val.ok{color:var(--green)}.val.warn{color:var(--yellow)}.val.bad{color:var(--red)}.url-box{background:rgba(4,7,10,.58);border:1px solid var(--border);border-radius:14px;padding:14px;font:12px ui-monospace,monospace;color:#bdd1ff;word-break:break-all;white-space:pre-line;margin-top:9px;user-select:all}.actions{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px;margin-top:18px}.button{min-height:52px;border:1px solid var(--border);border-radius:16px;padding:0 16px;background:rgba(38,44,54,.74);color:var(--text);font-weight:850;font-size:11px;cursor:pointer}.button.primary{background:var(--green);color:#052a12;border-color:var(--green);box-shadow:0 10px 28px rgba(83,224,118,.13)}@media(max-width:680px){.checklist{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions .primary{grid-column:1/-1}.card{padding:16px}}
</style>
</head>
<body>
<main>
  <h1>TRIP MUSIC • TAB S9 DIAGNOSTICS</h1>

  <div class="card">
    <h3 style="margin-top:0;color:var(--muted);font-size:13px;letter-spacing:0.1em;text-transform:uppercase;">1. Core Health Checklist</h3>
    <div class="checklist">
      <div class="item">
        <span class="label">Server Status</span>
        <span class="val ok" id="chk-server">✓ Online</span>
      </div>
      <div class="item">
        <span class="label">Worker Status</span>
        <span class="val" id="chk-worker">…</span>
      </div>
      <div class="item">
        <span class="label">Supabase Sync</span>
        <span class="val" id="chk-supabase">…</span>
      </div>
      <div class="item">
        <span class="label">Internet Connection</span>
        <span class="val" id="chk-internet">…</span>
      </div>
      <div class="item">
        <span class="label">Local Audio Buffer</span>
        <span class="val" id="chk-buffer">…</span>
      </div>
      <div class="item">
        <span class="label">Local Media Cache</span>
        <span class="val" id="chk-cache">…</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;color:var(--muted);font-size:13px;letter-spacing:0.1em;text-transform:uppercase;">2. Network & Player URLs</h3>
    <div style="margin-bottom:12px">
      <span class="label">Tablet Local IP:</span> <b id="chk-ip" style="color:#fff">-</b>
    </div>
    <div class="label">Direct Bus Display URL (Open on Tablet or Laptop in same Wi-Fi):</div>
    <div class="url-box" id="chk-urls">Loading…</div>
  </div>

  <div class="actions">
    <button class="button primary" onclick="location.href='/player'">▶ OPEN BUS DISPLAY</button>
    <button class="button" id="btn-tone">TEST AUDIO TONE</button>
    <button class="button" onclick="loadDiagnostics()">🔄 REFRESH</button>
    <button class="button" id="btn-purge">🧹 DELETE PLAYED CACHE</button>
  </div>
  <audio id="audio" controls style="display:none;margin-top:15px;width:100%"></audio>
</main>

<script>
async function loadDiagnostics(){
  try {
    const h = await fetch('/api/health').then(r=>r.json());
    document.getElementById('chk-server').textContent = '✓ Online (Port ' + (h.port || 3000) + ')';
    document.getElementById('chk-server').className = 'val ok';

    const wEl = document.getElementById('chk-worker');
    wEl.textContent = h.worker ? '✓ Online' : '✕ Offline';
    wEl.className = 'val ' + (h.worker ? 'ok' : 'bad');

    const sEl = document.getElementById('chk-supabase');
    sEl.textContent = h.supabase ? '✓ Connected' : '— Disconnected';
    sEl.className = 'val ' + (h.supabase ? 'ok' : 'warn');

    const iEl = document.getElementById('chk-internet');
    iEl.textContent = h.internetOnline ? '✓ Online' : '✕ Offline';
    iEl.className = 'val ' + (h.internetOnline ? 'ok' : 'bad');

    document.getElementById('chk-buffer').textContent = Math.ceil((h.bufferSeconds || 0) / 60) + ' min';
    try { const c = await fetch('/api/cache').then(r=>r.json()); document.getElementById('chk-cache').textContent = (c.entries || 0) + ' tracks • ' + ((c.totalBytes || 0)/1024/1024).toFixed(0) + ' MB / ' + ((c.maxBytes || 0)/1024/1024/1024).toFixed(1) + ' GB'; } catch { document.getElementById('chk-cache').textContent = (h.cache || 0) + ' tracks'; }

    const ips = (h.localAddresses && h.localAddresses.length > 0) ? h.localAddresses : ['127.0.0.1'];
    document.getElementById('chk-ip').textContent = ips.join(', ');

    const urls = (h.playerUrls && h.playerUrls.length > 0) ? h.playerUrls : [location.origin + '/player'];
    document.getElementById('chk-urls').textContent = urls.join('\n');
  } catch(e) {
    document.getElementById('chk-server').textContent = '✕ Unreachable';
    document.getElementById('chk-server').className = 'val bad';
  }
}

document.getElementById('btn-purge').onclick = async () => {
  const b = document.getElementById('btn-purge'); b.disabled = true; b.textContent = 'กำลังลบ…';
  try { await fetch('/api/cache/purge-finished', {method:'POST'}); await loadDiagnostics(); } finally { b.disabled = false; b.textContent = '🧹 DELETE PLAYED CACHE'; }
};

document.getElementById('btn-tone').onclick = () => {
  const a = document.getElementById('audio');
  a.style.display = 'block';
  a.src = '/api/test-tone';
  a.play().catch(e => console.warn('Audio tone play blocked:', e));
};

loadDiagnostics();
</script>
</body>
</html>
