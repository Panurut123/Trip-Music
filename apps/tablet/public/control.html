<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip Music Control</title><link rel="icon" href="data:,">
<style>
:root{--bg:#090c11;--panel:#171c24;--line:rgba(199,222,201,.14);--text:#f4f7f2;--muted:#aab5a7;--green:#53e076;--red:#ff928b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(600px 340px at 10% 0%,rgba(83,224,118,.1),transparent 70%),var(--bg);color:var(--text);font:15px system-ui,"Noto Sans Thai",sans-serif;padding:clamp(18px,4vw,38px)}main{max-width:980px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px;color:var(--green);font-size:26px;font-weight:900;letter-spacing:-.04em}.brand i{width:12px;height:22px;border-radius:100% 0 100% 0;background:var(--green);transform:rotate(28deg)}.live{font-size:10px;color:var(--muted);letter-spacing:.12em}.live:before{content:"";display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:7px;box-shadow:0 0 12px var(--green)}.panel{background:linear-gradient(145deg,rgba(29,35,44,.82),rgba(17,21,27,.74));border:1px solid var(--line);border-radius:24px;padding:22px;margin:14px 0;box-shadow:0 22px 65px rgba(0,0,0,.2)}.state-title{font-size:10px;letter-spacing:.15em;color:var(--muted);font-weight:900;margin-bottom:12px}.state{font-size:clamp(18px,3vw,28px);font-weight:850;line-height:1.35}.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:10px}.meta b{color:var(--text)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.button{min-height:62px;border-radius:18px;border:1px solid var(--line);background:rgba(38,44,54,.72);color:var(--text);font-weight:850;font-size:13px;transition:.15s ease}.button:hover{transform:translateY(-1px);border-color:rgba(83,224,118,.3)}.button.primary{background:var(--green);color:#052a12;border-color:var(--green);box-shadow:0 10px 28px rgba(83,224,118,.14)}.button.danger{color:var(--red);border-color:rgba(255,146,139,.25);background:rgba(255,80,72,.08)}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.button:first-child{grid-column:1/-1}.top{align-items:flex-start;flex-direction:column}.panel{padding:17px}}
</style></head><body><main><header class="top"><div class="brand"><i></i>Trip Music Control</div><div class="live">LOCAL PLAYER</div></header><section class="panel"><div class="state-title">BUS DISPLAY STATUS</div><div class="state" id="state">กำลังเชื่อมต่อ…</div></section><section class="grid"><button class="button primary" onclick="cmd('start')">▶ START TRIP</button><button class="button" onclick="cmd('pause')">Ⅱ PAUSE</button><button class="button" onclick="cmd('resume')">▶ RESUME</button><button class="button" onclick="cmd('skip')">▶| SKIP</button><button class="button danger" onclick="cmd('stop')">■ STOP</button></section></main><script>async function load(){try{const [s,q]=await Promise.all([fetch('/api/state').then(r=>r.json()),fetch('/api/queue').then(r=>r.json())]);const current=q.find(x=>x.id===s.currentQueueItemId);state.innerHTML=`${current?`<b>${esc(current.title)}</b>`:(s.tripStarted?'คิวว่าง • รอเพลงใหม่':'พร้อมเริ่มทริป')}<div class="meta"><span>STATUS <b>${esc(String(s.playbackStatus||'idle').toUpperCase())}</b></span><span>BUFFER <b>${Math.ceil((s.preparedBufferSeconds||0)/60)} MIN</b></span><span>QUEUE <b>${q.filter(x=>['waiting','preparing','ready','playing'].includes(x.status)).length}</b></span></div>`}catch{state.textContent='เชื่อมต่อ Player ไม่ได้'}}function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}async function cmd(c){await fetch('/api/player/'+(c==='start'?'start':c),{method:'POST'});setTimeout(load,180)}load();setInterval(load,2500)</script></body></html>
