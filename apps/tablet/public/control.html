<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip Music Control</title><style>body{margin:0;background:#10131a;color:#e1e2eb;font:18px system-ui,"Noto Sans Thai",sans-serif;padding:28px}main{max-width:900px;margin:auto}h1{color:#53e076}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.button{min-height:65px;border-radius:20px;border:1px solid #3d4a3d;background:#272a31;color:#e1e2eb;font-weight:800;font-size:18px}.danger{color:#ffb4ab}.panel{background:#191c22;border:1px solid #3d4a3d;border-radius:20px;padding:20px;margin:15px 0}</style></head><body><main><h1>Trip Music Control</h1><div class="panel" id="state">Loading…</div><div class="grid"><button class="button" onclick="cmd('start')">▶ Start Trip</button><button class="button" onclick="cmd('pause')">Ⅱ Pause</button><button class="button" onclick="cmd('resume')">▶ Resume</button><button class="button" onclick="cmd('skip')">▶| Skip</button><button class="button danger" onclick="cmd('stop')">■ Stop</button></div></main><script>async function load(){const [s,q]=await Promise.all([fetch('/api/state').then(r=>r.json()),fetch('/api/queue').then(r=>r.json())]);state.innerHTML=`Status: <b>${s.playbackStatus}</b><br>Current: ${q.find(x=>x.id===s.currentQueueItemId)?.title||'None'}<br>Buffer: ${Math.floor(s.preparedBufferSeconds/60)} minutes`;};async function cmd(c){await fetch('/api/player/'+(c==='start'?'start':c),{method:'POST'});load()}load();setInterval(load,3000)</script></body></html>
